receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Step 1: Calculate cost from token counts (optional — skip if your spans already have cost)
  costprocessor:
    model_attribute: "gen_ai.request.model"
    input_tokens_attribute: "gen_ai.usage.input_tokens"
    output_tokens_attribute: "gen_ai.usage.output_tokens"
    cache_read_tokens_attribute: "gen_ai.usage.cache_read_input_tokens"
    reasoning_tokens_attribute: "gen_ai.usage.reasoning_tokens"
    cost_attribute: "gen_ai.usage.cost_usd"

  # Step 2: Sample traces based on cost, errors, and duration
  traceshrink:
    cost_threshold: 0.10
    cost_attribute: "gen_ai.usage.cost_usd"
    keep_errors: true
    duration_threshold: 5s
    keep_attributes:
      - "important"
      - "billable"
    decision_wait: 30s
    num_traces: 100000

exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [costprocessor, traceshrink]
      exporters: [otlp]
